# Blueprint Render : déploie l'app entière depuis ce dépôt, sans outil local.
# Tableau de bord Render -> New -> Blueprint -> sélectionner ce dépôt -> Apply.
services:
  - type: web
    name: calendrier-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/docker/Dockerfile.api
    dockerContext: ./
    healthCheckPath: /api/health/live
    dockerCommand: sh -c "python -m cli pre-start && exec uv run --frozen --no-dev --no-sync --directory apps/api uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --timeout-graceful-shutdown 20"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calendrier-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: TELEMETRY_ENABLED
        value: "false"
      - key: MISTRAL_SECRETS_ENABLED
        value: "false"

  - type: web
    name: calendrier-web
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/docker/Dockerfile.web
    dockerContext: ./
    envVars:
      - key: API_TARGET
        fromService:
          type: web
          name: calendrier-api
          property: host

databases:
  - name: calendrier-db
    databaseName: calendrier
    plan: free
